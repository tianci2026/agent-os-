[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
ignore_missing_imports = True

[mypy-agent_os.models]
disallow_untyped_defs = True

[mypy-agent_os.observability]
disallow_untyped_defs = True

[mypy-agent_os.memory]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-agent_os.tools]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-agent_os.persistence]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-agent_os.retrieval]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-agent_os.workflow]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-agent_os.sandbox]
disallow_untyped_defs = True

[mypy-agent_os.sandbox_worker]
disallow_untyped_defs = True

[mypy-agent_os.auth]
disallow_untyped_defs = False
check_untyped_defs = True
